[project]
name = "r7sctl"
version = "0.1.0"
description = "Ravenetes: YAML-driven LV2/JACK audio plugin host"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "click>=8.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "rdflib>=7.0",
]

[project.scripts]
r7sctl = "r7s.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r7s"]

[tool.pytest.ini_options]
testpaths = ["tests"]
